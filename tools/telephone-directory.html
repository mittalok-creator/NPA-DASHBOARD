<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telephone Directory</title>
<!-- Synced with the main app's own theme toggle (2026-09-10) -- same
     technique as tools/passsheet.html: this tool is embedded via iframe
     on the same origin as the main app, so it can read the exact
     localStorage key the main app's own theme toggle writes (see
     setTheme() in js/app.js) directly, no postMessage needed. Runs before
     the <style> block below so data-theme is set before this tool's own
     dark-theme CSS variables ever need to apply -- no flash of the wrong
     theme. -->
<script>
(function(){
  function syncTheme(){
    try{
      var t = localStorage.getItem('upgb-theme');
      if(t==='dark'||t==='light') document.documentElement.dataset.theme = t;
      else delete document.documentElement.dataset.theme;
    }catch(e){}
  }
  syncTheme();
  window.addEventListener('storage', function(e){ if(e.key==='upgb-theme') syncTheme(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same design system as tools/passsheet.html and the two NPA/PNPA
     summary tools -- these are this tool's own copies of the same
     --bg/--surface/--accent/etc. tokens and the same Spectral+IBM Plex
     Sans typefaces, an iframe can't inherit them from the parent page,
     but the values are copied straight from there so every Utility tool
     reads as one family. */
  :root{
    --bg:#F2F5F3;
    --surface:#FFFFFF;
    --surface-muted:#EAEFEC;
    --ink:#16211C;
    --ink-muted:#5C6D64;
    --line:#D7DED9;
    --accent:#0E6B57;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEEE8;
    --debit:#A5432B;
    --credit:#0E6B57;
    --warn:#9A6A0A;
    --warn-soft:#F3E7CE;
    --shadow: 0 1px 2px rgba(20,40,32,.06), 0 6px 20px -8px rgba(20,40,32,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1C17;
      --surface:#15251F;
      --surface-muted:#1B2C25;
      --ink:#E7F1EC;
      --ink-muted:#93AA9F;
      --line:#28392F;
      --accent:#52C09B;
      --accent-ink:#08150F;
      --accent-soft:#1E362C;
      --debit:#E58B72;
      --credit:#63C79E;
      --warn:#E2B85B;
      --warn-soft:#3A3020;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1C17;
    --surface:#15251F;
    --surface-muted:#1B2C25;
    --ink:#E7F1EC;
    --ink-muted:#93AA9F;
    --line:#28392F;
    --accent:#52C09B;
    --accent-ink:#08150F;
    --accent-soft:#1E362C;
    --debit:#E58B72;
    --credit:#63C79E;
    --warn:#E2B85B;
    --warn-soft:#3A3020;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:0 22px 56px}

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 22px; margin-bottom:8px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{font-size:26px;line-height:1}
  .brand-name{font-family:'Spectral', Georgia, serif;font-weight:700;font-size:21px;letter-spacing:.2px}
  .brand-tag{font-size:12px;color:var(--ink-muted);margin-top:1px}

  .btn{
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);cursor:pointer;
  }
  .btn:hover{border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-ghost{background:transparent}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0 20px;box-shadow:var(--shadow)}
  .search-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
  .search-row:focus-within{border-color:var(--accent)}
  .search-row svg{flex-shrink:0;color:var(--ink-muted)}
  .search-row input{
    flex:1;border:none;background:none;outline:none;color:var(--ink);
    font-family:inherit;font-size:14.5px;min-width:0;
  }
  .search-row input::placeholder{color:var(--ink-muted)}
  .search-row .btn{flex-shrink:0;padding:6px 12px;font-size:12.5px}
  .filter-row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .btn-filter{padding:7px 14px;font-size:12.5px}
  .btn-filter.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .hint{font-size:12px;color:var(--ink-muted);margin-top:10px;line-height:1.5}

  .section-label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--credit);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0}

  table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface)}
  thead th{position:sticky;top:0;background:var(--surface-muted);color:var(--ink-muted);padding:0;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
  .th-inner{display:flex;align-items:center;gap:6px;padding:8px 12px}
  .th-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}
  .col-copy-btn{
    flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
    border-radius:6px;border:1px solid transparent;background:none;color:var(--ink-muted);cursor:pointer;padding:0;
  }
  .col-copy-btn:hover,.col-copy-btn:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
  .col-copy-btn.copied{background:var(--accent-soft);color:var(--credit)}
  .col-copy-btn svg{width:12px;height:12px;pointer-events:none}
  tbody td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--surface-muted)}
  tbody td a{color:var(--accent);text-decoration:none;font-variant-numeric:tabular-nums}
  tbody td a:hover{text-decoration:underline}
  .whatsapp-link{display:inline-flex;vertical-align:middle;color:#25D366}
  .whatsapp-link svg{width:14px;height:14px}
  .whatsapp-link:hover{opacity:.8}
  .table-wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .empty-row td{text-align:center;color:var(--ink-muted);padding:30px}

  .site-foot{
    text-align:center;padding:28px 22px 34px;margin-top:20px;border-top:1px solid var(--line);
    font-family:'Spectral', Georgia, serif;font-size:12.5px;letter-spacing:.02em;color:var(--ink-muted);
  }
  .site-foot span{color:var(--accent);font-weight:600}
</style>

  function sortArrow(sort, key){
    if (!sort || sort.key !== key) return '';
    return sort.dir === 'asc' ? ' ▲' : ' ▼';
  }

  // Copy-a-whole-column -- same convention as the NPA/PNPA summary
  // tools: only the data rows, not the column's own name, so it pastes
  // cleanly into another sheet.
  var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  function columnHeaderHtml(c){
    return '<th data-key="'+esc(c.key)+'"><div class="th-inner"><span class="th-label sortable" data-key="'+esc(c.key)+'" title="Click to sort">'+esc(c.label)+sortArrow(sortState, c.key)+'</span>'+
      '<button type="button" class="col-copy-btn" title="Copy this column" aria-label="Copy '+esc(c.label)+' column">'+COPY_ICON+'</button>'+
      '</div></th>';
  }
  function columnCellTexts(table, colIndex){
    var lines = [];
    table.querySelectorAll('tbody tr').forEach(function(tr){
      var td = tr.children[colIndex];
      if (td) lines.push(td.textContent.trim());
    });
    return lines;
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }
  function copyColumn(btn){
    var th = btn.closest('th');
    var table = btn.closest('table');
    if (!th || !table) return;
    var colIndex = Array.prototype.indexOf.call(th.parentNode.children, th);
    var text = columnCellTexts(table, colIndex).join('\n');
    var showCopied = function(){
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(function(){ fallbackCopy(text); showCopied(); });
    } else {
      fallbackCopy(text);
      showCopied();
    }
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.col-copy-btn') : null;
    if (!btn) return;
    e.stopPropagation();
    copyColumn(btn);
  });
  document.addEventListener('click', function(e){
    var label = e.target.closest ? e.target.closest('.th-label.sortable') : null;
    if (!label) return;
    var key = label.getAttribute('data-key');
    if (!key) return;
    sortState = (sortState && sortState.key === key) ? { key: key, dir: sortState.dir === 'asc' ? 'desc' : 'asc' } : { key: key, dir: 'asc' };
    render();
  });

  function matchesSearch(rec, q){
    if (!q) return true;
    return String(rec.sol).indexOf(q) !== -1 ||
      String(rec.ec).indexOf(q) !== -1 ||
      rec.name.toLowerCase().indexOf(q) !== -1 ||
      rec.designation.toLowerCase().indexOf(q) !== -1 ||
      rec.cadre.toLowerCase().indexOf(q) !== -1 ||
      rec.branch.toLowerCase().indexOf(q) !== -1 ||
      rec.contact.indexOf(q) !== -1;
  }

  function isBranchManager(rec){
    return rec.designation.toUpperCase() === 'BRANCH MANAGER';
  }

  // WhatsApp deep link next to the tel: link -- wa.me needs a plain
  // digit string with country code, so a bare 10-digit Indian mobile
  // number gets "91" prepended; anything already longer, or malformed
  // (a couple of source rows have a stray space or a missing digit), is
  // passed through as-is rather than guessed at.
  function whatsappDigits(contact){
    var digits = String(contact || '').replace(/\D/g, '');
    if (digits.length === 10) digits = '91' + digits;
    return digits;
  }
  var WHATSAPP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.45 1.27 4.9L2 22l5.25-1.38a9.94 9.94 0 0 0 4.79 1.22h.01c5.52 0 10-4.48 10-10s-4.49-9.84-10.01-9.84zm0 18.16a8.2 8.2 0 0 1-4.17-1.14l-.3-.18-3.11.82.83-3.03-.2-.31a8.18 8.18 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.25 0 4.55-3.7 8.19-8.28 8.19zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.98-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.48-1.39-1.73-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.42-.14-.01-.31-.01-.48-.01a.93.93 0 0 0-.67.31c-.23.25-.87.85-.87 2.08 0 1.23.89 2.42 1.02 2.58.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.11-.23-.17-.48-.29z"/></svg>';

  function renderCell(c, rec){
    if (c.key === 'contact'){
      return '<td><a href="tel:'+esc(rec.contact)+'">'+esc(rec.contact)+'</a> '+
        '<a class="whatsapp-link" href="https://wa.me/'+esc(whatsappDigits(rec.contact))+'" target="_blank" rel="noopener" title="Chat on WhatsApp" aria-label="Chat with '+esc(rec.name)+' on WhatsApp">'+WHATSAPP_ICON+'</a></td>';
    }
    return '<td>'+esc(rec[c.key])+'</td>';
  }

  function render(){
    var q = searchInput.value.trim().toLowerCase();
    var filtered = applySort(ALL_RECORDS.filter(function(rec){
      return matchesSearch(rec, q) && (!bmOnly || isBranchManager(rec));
    }), sortState);

    staffHeadRow.innerHTML = COLUMNS.map(columnHeaderHtml).join('');
    staffBody.innerHTML = filtered.length
      ? filtered.map(function(rec){ return '<tr>'+COLUMNS.map(function(c){ return renderCell(c, rec); }).join('')+'</tr>'; }).join('')
      : '<tr class="empty-row"><td colspan="'+COLUMNS.length+'">No matching staff found.</td></tr>';

    resultCountBadge.textContent = (q || bmOnly) ? (filtered.length + ' of ' + ALL_RECORDS.length) : (ALL_RECORDS.length + ' total');
    clearSearchBtn.hidden = !q;
    resizeFrame();
  }

  searchInput.addEventListener('input', render);
  clearSearchBtn.addEventListener('click', function(){
    searchInput.value = '';
    render();
    searchInput.focus();
  });
  bmOnlyBtn.addEventListener('click', function(){
    bmOnly = !bmOnly;
    bmOnlyBtn.classList.toggle('active', bmOnly);
    bmOnlyBtn.setAttribute('aria-pressed', String(bmOnly));
    render();
  });

  // Same iframe self-sizing as the NPA/PNPA summary tools (same-origin
  // window.frameElement) -- no overscroll-behavior:none on html/body,
  // since that blocks the scroll *chaining* a touch-drag needs to hand a
  // gesture up to the parent page's #mainCol once this iframe has
  // nothing left of its own to scroll (see the mobile bug fixed on those
  // two tools, 2026-09-10).
  function resizeFrame(){
    if (!window.frameElement) return;
    requestAnimationFrame(function(){
      window.frameElement.style.height = document.documentElement.scrollHeight + 'px';
    });
  }
  window.addEventListener('resize', resizeFrame);
  window.addEventListener('load', resizeFrame);

  render();
})();
</script>
</body>
</html>
